  <body>
    <header class="topbar">
      <div class="container topbar-inner">
        <a href="index.html" class="logo" aria-label="Aarab home">
          <span>Farokhadz</span>
        </a>
        <div class="topbar-actions">
          <a href="resume.html" class="topbar-link">Resume</a>
          <button type="button" class="tag search-badge" id="search-btn">
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="11" cy="11" r="7" />
              <path d="M21 21l-4.35-4.35" />
            </svg>
            Ctrl + K
          </button>
          <button
            type="button"
            class="menu-btn"
            id="menu-btn"
            aria-label="Open menu"
            aria-expanded="false"
          >
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >

    <main class="container">
      <section class="section" id="resume">
        <nav class="label breadcrumb" aria-label="Breadcrumb">
          <a href="index.html">Home</a> / <span>Resume</span>
        </nav>
        <div class="section-head">
          <h1 class="section-title">Resume</h1>
        </div>
        <p class="resume-intro">
          A digital copy of my resume. You can inspect the document below or
          download the PDF version for print and offline review.
        </p>
        <div class="card resume-file">
          <div class="resume-file-name">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="8" y1="13" x2="16" y2="13" />
              <line x1="8" y1="17" x2="16" y2="17" /></svg
            ><span>Farokhadz-Resume.pdf</span>
          </div>
          <div class="resume-file-actions">
            <a
              href="resume/Farokhadz-Resume.pdf"
              class="btn"
              target="_blank"
              rel="noopener noreferrer"
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
                />
                <polyline points="15 3 21 3 21 9" />
                <line x1="10" y1="14" x2="21" y2="3" />
              </svg>
              Open</a
            >
            <a href="resume/Farokhadz-Resume.pdf" class="btn primary" download
              ><svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Download PDF</a
            >
          </div>
        </div>
        <iframe
          class="resume-preview"
          src="resume/Farokhadz-Resume.pdf#toolbar=0&navpanes=0"
          title="Resume PDF preview"
        ></iframe>
      </section>
      <div class="hatch"></div>
    </main>
